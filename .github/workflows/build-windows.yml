name: Build Windows desktop app

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: packaging\build_windows.bat
      - run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item "packaging\Windows使用说明.txt" "release\Windows使用说明.txt"
          Compress-Archive -Path "dist\BWIH Dispatch.exe", "release\Windows使用说明.txt" -DestinationPath "release\BWIH-Dispatch-Windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: BWIH-Dispatch-Windows
          path: release/BWIH-Dispatch-Windows-x64.zip
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/BWIH-Dispatch-Windows-x64.zip
