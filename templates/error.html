{% extends "base.html" %}
{% block title %}{{ title }} - BWIH{% endblock %}

{% block content %}
<div class="max-w-lg mx-auto bg-white rounded shadow p-8 text-center">
    <h1 class="text-2xl font-bold text-red-600 mb-3">{{ title }}</h1>
    <p class="text-gray-600 mb-6">{{ message }}</p>
    <a href="{{ back_url }}" class="inline-block bg-blue-600 text-white px-5 py-2 rounded hover:bg-blue-700">{{ back_label }}</a>
</div>
{% endblock %}
