<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}BWIH{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
    <nav class="bg-blue-600 text-white">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <a href="/" class="text-xl font-bold">BWIH</a>
            <div class="flex space-x-4 text-sm">
                <a href="/" class="hover:underline">今日</a>
                <a href="/checkin" class="hover:underline">Check-in</a>
                <a href="/upload" class="hover:underline">上传表格</a>
                <a href="/drivers" class="hover:underline">司机</a>
                <a href="/carriers" class="hover:underline">供应商</a>
            </div>
        </div>
    </nav>
    <main class="max-w-6xl mx-auto px-4 py-6">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
